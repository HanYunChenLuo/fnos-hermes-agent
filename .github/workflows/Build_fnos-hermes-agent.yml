name: Build fnOS Hermes Agent FPK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（格式：0.22.5，留空则使用 manifest 中的版本）'
        required: false
        default: ''
  push:
    # feature 分支 push 即验证打包链路（仅构建 + 上传 artifact，不创建 Release）
    branches: ['feature/**']

permissions:
  contents: write

env:
  APP_NAME: "hermes-agent"
  MANIFEST_FILE: "manifest"

jobs:
  build-fpk:
    runs-on: ubuntu-latest
    outputs:
      fpk_name: ${{ steps.build.outputs.fpks }}
      version: ${{ steps.version.outputs.version }}

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 设置时区
      - name: Set timezone
        run: sudo timedatectl set-timezone "Asia/Shanghai"

      # 3. 读取 manifest 版本信息
      - name: Get version from manifest
        id: version
        run: |
          VERSION=$(grep "^version" ${{ env.MANIFEST_FILE }} | awk -F'=' '{print $2}' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "从 manifest 读取的版本号：v$VERSION"

      # 4. 确定最终版本号
      - name: Determine target version
        id: target_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TARGET_VERSION="${{ github.event.inputs.version }}"
            echo "使用输入的版本号：v$TARGET_VERSION"
          else
            TARGET_VERSION="${{ steps.version.outputs.version }}"
            echo "使用 manifest 版本号：v$TARGET_VERSION"
          fi
          echo "target_version=$TARGET_VERSION" >> $GITHUB_OUTPUT

      # 5. 更新 manifest 版本号（整行替换：旧正则 s/^version.*=/.../ 只匹配到等号，
      # 旧版本号会残留在行尾，导致应用中心显示 "0.21.23 0.21.23" 重复版本号）
      - name: Update manifest version
        run: |
          VERSION="${{ steps.target_version.outputs.target_version }}"
          sed -i -E "s/^version[[:space:]]*=.*/version               = $VERSION/" ${{ env.MANIFEST_FILE }} || exit 1
          echo "Updated manifest:"
          grep "^version" ${{ env.MANIFEST_FILE }}

      # 6. 打包（build-fpk.sh 一条打包路径：自动 clone hermes-src（HERMES_TAG 钉定）+
      #    前端预构建 + rsync 精简 + pyproject 版本注入 + 模式归一化 + fnpack；
      #    fnpack 缺失时脚本自动下载官方 linux-amd64 构建；manifest checksum 由 fnpack 回填）
      - name: Build FPK
        id: build
        run: |
          bash build-fpk.sh
          VERSION="${{ steps.target_version.outputs.target_version }}"
          FPK="pkg/fnos-hermes-agent_v${VERSION}.fpk"
          if [ ! -f "$FPK" ]; then echo "::error:: FPK 未生成: $FPK"; exit 1; fi
          SIZE=$(du -h "$FPK" | cut -f1)
          echo "打包成功：$(basename "$FPK") ($SIZE)"
          echo "fpks=$(basename "$FPK")" >> $GITHUB_OUTPUT
          echo "size=$SIZE" >> $GITHUB_OUTPUT

      # 7. 上传构建产物（push 验证与 dispatch 均上传，便于直接下载）
      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.fpks }}
          path: pkg/*.fpk
          if-no-files-found: error

      # 8. 准备 Release 说明
      - name: Generate release notes
        id: release_notes
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION="${{ steps.target_version.outputs.target_version }}"
          FPK_NAME="fnos-${{ env.APP_NAME }}_v${VERSION}.fpk"

          printf '\n*Commit: %s*\n' "${{ github.sha }}" > release_body.md

          echo "Release notes 已生成"
          echo "fpk_name=$FPK_NAME" >> $GITHUB_OUTPUT

      # 9. 创建 Draft Release（仅手动 dispatch；feature push 只做构建验证）
      - name: Create Draft Release
        id: create_release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.target_version.outputs.target_version }}"
          FPK_NAME="fnos-${{ env.APP_NAME }}_v${VERSION}.fpk"
          RELEASE_TAG="v${VERSION}"
          DIST_DIR="pkg"

          echo "创建 Draft Release: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" \
            "$DIST_DIR/$FPK_NAME" \
            --draft \
            --title "$RELEASE_TAG" \
            --notes-file release_body.md || exit 1

          echo "Draft Release 已创建"
          echo "release_url=https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG" >> $GITHUB_OUTPUT

      # 10. 构建摘要
      - name: Build Summary
        run: |
          echo "### ✅ 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 版本 | FPK 文件名 | 大小 | 触发方式 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|-----------|------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| fnOS Hermes Agent | v${{ steps.target_version.outputs.target_version }} | ${{ steps.build.outputs.fpks }} | ${{ steps.build.outputs.size }} | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**[Draft Release](https://github.com/${{ github.repository }}/releases)** — 请确认后发布" >> $GITHUB_STEP_SUMMARY
          fi
